name: "E-Commerce Purchase Flow"
description: "Complete user journey from product browse to checkout"

# Longer timeout for multi-step flow
timeout: 480
step_timeout: 60

# Exponential backoff for API calls and page loads
retry_policy:
  type: "exponential"
  max_retries: 3
  base_delay: 2.0
  max_delay: 30.0

# Allow some non-critical steps to fail
fuzziness: 0.15

# Balanced temperature
temperature: 0.7

headless: true
screenshot_on_failure: true

# Performance tuning - balanced for reliability
# For speed testing in dev, use: 0.2 / 0.2
browser_profile:
  minimum_wait_page_load_time: 1.5  # E-commerce sites often have heavy pages
  wait_between_actions: 1.0

# E-commerce specific variables
env:
  PRODUCT_SEARCH: "laptop"
  EXPECTED_MIN_PRICE: "500"
  SHIPPING_ADDRESS: "123 Test St, Test City, TC 12345"
  
metadata:
  priority: "critical"
  category: "user-journey"
  estimated_duration: "6-8 minutes"

