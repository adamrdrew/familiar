# suite.yaml Schema Extension: browser_profile

## Overview

This document extends the existing suite.yaml schema with an optional `browser_profile` field for controlling browser timing and behavior.

## Schema Addition

```yaml
# Full suite.yaml with new browser_profile field
name: string                    # Required: Suite name
temperature: float              # Optional: LLM temperature (default: 0.5)
step_timeout: int               # Optional: Per-step timeout in seconds (default: 60)
timeout: int                    # Optional: Total suite timeout in seconds (default: 300)
fuzziness: float                # Optional: Failure tolerance 0.0-1.0 (default: 0.0)
retry_policy:                   # Optional: Retry configuration
  type: string                  # "fixed", "exponential", or "best_of_n"
  max_retries: int
  delay: float
browser_profile:                # ✨ NEW: Optional browser configuration
  minimum_wait_page_load_time: float  # Optional: Page load wait (default: 1.0)
  wait_between_actions: float         # Optional: Action delay (default: 1.0)
  headless: bool                      # Optional: Headless mode (default: true)
```

## browser_profile Field Specification

**Field**: `browser_profile`  
**Type**: Object (optional)  
**Default**: `null` (uses default values)  
**Purpose**: Configure browser timing and behavior for performance optimization

### Sub-fields

#### minimum_wait_page_load_time

**Type**: `float`  
**Default**: `1.0`  
**Range**: `0.0` - `30.0`  
**Unit**: Seconds  
**Purpose**: Minimum time to wait after page navigation before proceeding

**Behavior**:
- Browser waits at least this long for page elements to load
- Lower values = faster tests but may miss slow-loading elements
- Higher values = more reliable but slower tests

**Examples**:
```yaml
minimum_wait_page_load_time: 0.1   # Very fast, for stable pages
minimum_wait_page_load_time: 1.0   # Default, balanced
minimum_wait_page_load_time: 3.0   # Slow, for pages with heavy assets
```

#### wait_between_actions

**Type**: `float`  
**Default**: `1.0`  
**Range**: `0.0` - `30.0`  
**Unit**: Seconds  
**Purpose**: Time to wait between consecutive browser actions (clicks, typing, etc.)

**Behavior**:
- Adds delay between each action the agent takes
- Lower values = faster tests but may cause race conditions
- Higher values = more reliable for pages with slow JavaScript

**Examples**:
```yaml
wait_between_actions: 0.1   # Very fast, minimal delay
wait_between_actions: 1.0   # Default, safe for most sites
wait_between_actions: 2.0   # Conservative, for slow sites
```

#### headless

**Type**: `boolean`  
**Default**: `true`  
**Purpose**: Run browser in headless mode (no GUI)

**Behavior**:
- `true`: Browser runs without visible window (faster, CI-friendly)
- `false`: Browser window is visible (useful for debugging)
- CLI flag `--no-headless` overrides this setting

**Examples**:
```yaml
headless: true    # Default, no GUI
headless: false   # Show browser (for development)
```

## Validation Rules

### Type Validation

```yaml
# ✅ Valid
browser_profile:
  minimum_wait_page_load_time: 0.5
  wait_between_actions: 1.2
  headless: true

# ❌ Invalid: Wrong types
browser_profile:
  minimum_wait_page_load_time: "fast"  # Must be number
  wait_between_actions: true            # Must be number
  headless: 1                           # Must be boolean
```

### Range Validation

```yaml
# ✅ Valid
browser_profile:
  minimum_wait_page_load_time: 0.0   # Minimum allowed
  wait_between_actions: 30.0         # Maximum allowed

# ❌ Invalid: Out of range
browser_profile:
  minimum_wait_page_load_time: -1.0  # Cannot be negative
  wait_between_actions: 100.0        # Cannot exceed 30.0
```

**Error Messages**:
```
ValidationError: Wait times cannot be negative
ValidationError: Wait times above 30s are not recommended
ValidationError: Input should be a valid boolean
```

## Complete Examples

### Example 1: Default (Omit browser_profile)

```yaml
name: "Standard Test Suite"
temperature: 0.5
step_timeout: 60
timeout: 300
fuzziness: 0.0
retry_policy:
  type: "fixed"
  max_retries: 0
# No browser_profile field - uses defaults (1.0s, 1.0s, true)
```

**Behavior**: Uses default browser timing (1.0s waits, headless)

### Example 2: Fast Mode Configuration

```yaml
name: "Fast Test Suite"
temperature: 0.0
step_timeout: 30
timeout: 180
fuzziness: 0.0
retry_policy:
  type: "fixed"
  max_retries: 1
browser_profile:
  minimum_wait_page_load_time: 0.1
  wait_between_actions: 0.1
  headless: true
```

**Behavior**: Very fast browser timing (0.1s waits), ideal for stable pages

### Example 3: Slow/Unreliable Site Configuration

```yaml
name: "Slow Site Test"
temperature: 0.5
step_timeout: 120
timeout: 600
fuzziness: 0.2
retry_policy:
  type: "exponential"
  max_retries: 3
  base_delay: 2.0
browser_profile:
  minimum_wait_page_load_time: 3.0
  wait_between_actions: 2.0
  headless: true
```

**Behavior**: Conservative timing (2-3s waits) for slow-loading pages

### Example 4: Development/Debug Configuration

```yaml
name: "Debug Test"
temperature: 0.5
step_timeout: 60
timeout: 300
fuzziness: 0.0
retry_policy:
  type: "fixed"
  max_retries: 0
browser_profile:
  minimum_wait_page_load_time: 1.0
  wait_between_actions: 1.0
  headless: false  # Show browser for debugging
```

**Behavior**: Standard timing, visible browser for watching test execution

### Example 5: Partial Configuration

```yaml
name: "Partial Config Test"
browser_profile:
  minimum_wait_page_load_time: 0.5
  # Omit wait_between_actions - uses default 1.0
  # Omit headless - uses default true
```

**Behavior**: Custom page load wait (0.5s), default action wait (1.0s), headless

## CLI Interaction

### --no-headless Flag Override

**Configuration**:
```yaml
browser_profile:
  headless: true  # Suite says headless
```

**Command**:
```bash
familiar run my-suite --no-headless  # CLI says show browser
```

**Result**: CLI flag wins, browser is visible (headless=false)

**Priority**: CLI flags > suite.yaml config

## Backward Compatibility

### Existing suite.yaml Files

**Before** (still valid):
```yaml
name: "Legacy Test"
temperature: 0.5
```

**Behavior**: Works unchanged, uses default browser timing

### Migration Path

**Optional**: Add `browser_profile` when you want custom timing

```yaml
name: "Migrated Test"
temperature: 0.5
browser_profile:      # ← Add this section
  minimum_wait_page_load_time: 0.5
  wait_between_actions: 0.5
```

**No migration required**: Existing files work as-is

